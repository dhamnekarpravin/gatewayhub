services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  user-service:
    build: ./user-service
    environment:
      DB_NAME: users_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      DB_PORT: "3306"
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: user-service,localhost
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES}
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/orders_db?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO}
    depends_on:
      mysql:
        condition: service_healthy

  ml-service:
    build: ./ml-service

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      ML_SERVICE_URL: http://ml-service:8003
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RATE_LIMIT: ${RATE_LIMIT}
    depends_on:
      - user-service
      - order-service
      - ml-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data: